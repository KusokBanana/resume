summary:
  ru: >-
    Frontend-направление продуктов дирекции информационных технологий: четыре
    кросс-функциональные команды из техлидов, frontend-разработчиков и UX/UI-дизайнеров.
    Отвечал за направление целиком — от стратегии и найма до технических решений
    и того, что в итоге видел пользователь. Держал баланс между интересами бизнеса,
    продукта и команды.
  en: >-
    The frontend function across the IT directorate's products: four cross-functional
    teams of tech leads, frontend engineers and UX/UI designers. I owned the function
    end to end, from strategy and hiring through to technical decisions and what users
    actually saw, holding the balance between the business, the product and the team.
groups:
  - title: { ru: Продукты, en: Products }
    highlights:
      - text:
          ru: Вёл полный цикл разработки интерфейсов, от low-fi-прототипов до промышленного релиза и дальнейшего развития на проде.
          en: Ran the full UI lifecycle, from low-fidelity prototypes through to production release and continued work on prod.
        tags: {}
      - text:
          ru: "Отвечал за интерфейсы Корпоративного и Партнёрского порталов, Aim (автоматизация управления инфраструктурой), Preboarding (найм и онбординг) и нескольких продуктов поменьше."
          en: "Owned the UIs of the Corporate and Partner portals, Aim (infrastructure-management automation), Preboarding (hiring and onboarding) and a handful of smaller products."
        tags: {}
      - text:
          ru: Держал стабильную поставку интерфейсов для продуктов с живой пользовательской базой.
          en: Kept UI delivery steady for products with a live user base.
        tags: { audience: [hr, technical], domains: [linkedin-skip] }
  - title: { ru: Команды и процессы, en: Teams & process }
    highlights:
      - text:
          ru: "Построил frontend-направление с нуля: найм, онбординг, зоны ответственности, стратегия; масштабировал отдел с 0 до 11 человек за год."
          en: "Built the frontend function from scratch: hiring, onboarding, ownership areas, strategy; scaled the department from 0 to 11 people in a year."
        tags: {}
      - text:
          ru: "Часть команд досталась «по наследству»: навёл процессы, сделал работу прозрачной и управляемой, выстроил доверительные рабочие отношения."
          en: "Some teams came to me by inheritance: I put process in place, made the work transparent and manageable, and built trusting working relationships."
        tags: { domains: [linkedin-skip] }
      - text:
          ru: Полностью сменил команду на одном из продуктов и бесшовно перевёл интерфейс на современный стек, не останавливая развитие продукта.
          en: Fully replaced a product's team and migrated its UI to a modern stack seamlessly, without pausing product development.
        tags: { audience: [hr, technical] }
      - text:
          ru: Запустил дизайн-ревью, и визуальные баги упали со стабильных 5–10 до 0–1 на релиз.
          en: Started running design review, and visual bugs fell from a steady 5–10 to 0–1 per release.
        tags: {}
      - text:
          ru: "Перестроил разработку email-писем: там, где раньше уходила неделя на связку «дизайнер плюс разработчик», теперь справляется один разработчик за пару часов."
          en: "Reworked how we build emails: what used to take a designer and a developer about a week now takes one developer a couple of hours."
        tags: { audience: [hr, technical], domains: [linkedin-skip] }
  - title: { ru: Люди, en: People }
    highlights:
      - text:
          ru: "Развивал команду через индивидуальные планы развития (ИПР): трое доросли до Senior, ещё трое стали лидами."
          en: "Grew the team through individual development plans: three reached Senior, three more became leads."
        tags: {}
      - text:
          ru: За два года отдел не покинул добровольно ни один человек, и это на фоне турбулентности в компании — урезаний бюджетов и массовых сокращений; потери были только в рамках общекорпоративного сокращения штата.
          en: Over two years not a single person left the department voluntarily, and that was amid company turbulence — budget cuts and mass layoffs; the only losses came with company-wide reductions.
        tags: {}
      - text:
          ru: "Повысил автономность команд и снизил bus-factor: работа перестала завязываться на отдельных людях."
          en: "Made the teams more autonomous and lowered the bus factor: the work no longer hinged on individual people."
        tags: { audience: [hr, technical], domains: [linkedin-skip] }
      - text:
          ru: Принимал сложные управленческие решения, включая расставание с сотрудниками в рамках оптимизации команды.
          en: Made hard management calls, including parting with team members during team optimisation.
        tags: { audience: [hr], domains: [linkedin-skip] }
  - title: { ru: Технологии и hands-on, en: Technology & hands-on }
    highlights:
      - text:
          ru: "Внедрил AI-assisted development (Claude и подобные инструменты): прототипирование, рефакторинг, написание кода и ревью ускорились примерно в полтора раза."
          en: "Brought in AI-assisted development (Claude and similar): prototyping, refactoring, coding and review got about 1.5× faster."
        tags: {}
      - text:
          ru: Добавил в библиотеку компонентов поддержку llms.txt — машиночитаемую документацию для LLM. Теперь AI-ассистенты используют компоненты корректно из коробки, без ручного контекста.
          en: Added llms.txt support to the component library — machine-readable docs for LLMs. AI assistants now use the components correctly out of the box, without hand-fed context.
        tags: { audience: [technical] }
      - text:
          ru: Сам садился за код ключевых частей интерфейсов на React и Angular — точечно, в сложных и критичных местах.
          en: Got hands-on with the code of key UI parts in React and Angular — selectively, in the complex and critical spots.
        tags: {}
      - text:
          ru: Прорабатывал архитектурные решения, проводил код-ревью; владею frontend-архитектурой и стандартами разработки интерфейсов.
          en: Shaped architectural decisions and ran code reviews; strong in frontend architecture and UI development standards.
        tags: { audience: [hr, technical], domains: [linkedin-skip] }
      - text:
          ru: Автоматизировал внутренние процессы и tooling на Python — скрипты, вспомогательные сервисы, оптимизация рутинных операций.
          en: Automated internal processes and tooling in Python — scripts, helper services, routine-operation optimisation.
        tags: { audience: [technical] }
  - title: { ru: Frontend-инфраструктура и FrontOps, en: Frontend infra & FrontOps }
    highlights:
      - text:
          ru: Спроектировал и развивал frontend-инфраструктуру команды.
          en: Designed and evolved the team's frontend infrastructure.
        tags: { audience: [hr, technical], domains: [linkedin-skip] }
      - text:
          ru: "Автоматизировал релизный цикл (скрипты + CI/CD): подготовка релиза сократилась с 2 часов до 10 минут."
          en: Automated the release cycle (scripts + CI/CD) — release prep dropped from 2 hours to 10 minutes.
        tags: {}
      - text:
          ru: Сделал сборку и публикацию пакетов полностью автоматическими — от push до merge и release без единого ручного шага.
          en: Made package build and publish fully automatic — from push to merge to release with zero manual steps.
        tags: { audience: [technical] }
      - text:
          ru: Повысил стабильность релизов и предсказуемость поставки, снизил операционную нагрузку на команды.
          en: Improved release stability and delivery predictability, reduced operational load on teams.
        tags: { audience: [hr, technical], domains: [linkedin-skip] }
