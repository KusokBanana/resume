      ru: "Реализовал внутренний интерфейс автоматического деплоя и управления серверами (prod/test/dev) с настройкой характеристик и интеграцией с API Ansible."
      en: "Made an internal UI for automated deploy and server management (prod/test/dev) with configurable specs and Ansible API integration."
    tags: {}
