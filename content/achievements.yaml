# Ключевые результаты (вверху резюме). Жирный лид-акцент через **...**.
# Порядок — по priority (выше = выше).
items:
  - id: scale
    priority: 100
    tags: {}
    text:
      ru: "**Масштабировал отдел с 0 до 11 человек за год.** Собрал четыре кросс-функциональные команды — в каждой лид, фронтендеры и дизайнер. Весь найм вёл сам: и с рынка, и ротацией внутри."
      en: "**Scaled the department from 0 to 11 people in a year.** Built four cross-functional teams, each with a lead, frontend engineers and a designer. I ran all the hiring myself, both externally and through internal moves."

  - id: retention
    priority: 95
    tags: {}
    text:
      ru: "**91% удержания команды за два года.** Сохранил ядро отдела на фоне турбулентности в компании: урезания бюджетов и массовых сокращений."
      en: "**91% team retention over two years.** Kept the core of the department together through company turbulence: budget cuts and mass layoffs."

  - id: growth
    priority: 90
    tags: {}
    text:
      ru: "**Вырастил людей через ИПР**: трое доросли до старших разработчиков и дизайнеров, ещё трое стали руководителями."
      en: "**Grew people through development plans**: three reached senior engineer or designer, three more became team leads."

  - id: ai-speedup
    priority: 85
    tags: {}
    text:
      ru: "**Ускорил разработку в полтора раза**, встроив AI-инструменты (Claude) в процессы команды."
      en: "**Sped up delivery by half** by building AI tooling (Claude) into the team's workflow."

  - id: vk-release-flags
    priority: 82
    tags: {}
    text:
      ru: "**Релизы несколько раз в день** в highload-финтехе ВКонтакте: поднял feature-flags с выборочным раскатом на сегменты пользователей."
      en: "**Multiple releases a day** in VK's high-load fintech: I set up feature flags with selective rollout to user segments."

  - id: release-time
    priority: 80
    tags: {}
    text:
      ru: "**Сократил подготовку релиза с двух часов до десяти минут**, автоматизировав её скриптами и CI/CD."
      en: "**Cut release prep from two hours to ten minutes** by automating it with scripts and CI/CD."

  - id: visual-bugs
    priority: 75
    tags: {}
    text:
      ru: "**Свёл визуальные баги с 5–10 до 0–1 на релиз**, запустив дизайн-ревью."
      en: "**Brought visual bugs down from 5–10 to 0–1 per release** by introducing design review."

  - id: email-cost
    priority: 70
    tags: {}
    text:
      ru: "**Удешевил разработку email-писем**: раньше это была связка «дизайнер плюс разработчик, около недели», теперь — один разработчик за пару часов."
      en: "**Made building emails far cheaper**: what used to take a designer and a developer about a week now takes one developer a couple of hours."
