summary:
  ru: >-
    Финтех ВКонтакте, продукт «Кабинет выплат» (Cashout): полноценный интерфейс
    самостоятельного вывода средств, где автор выбирает источник заработка по своим
    монетизациям и выводит нужную сумму. Highload-сервис в экосистеме VK. На эту
    роль вырос из старшего фронтенд-разработчика.
  en: >-
    VK fintech, the Cashout product: a full self-service money-withdrawal interface
    where a creator picks an earnings source among their monetisations and cashes out
    the amount they need. A high-load service inside the VK ecosystem. I grew into this
    role from senior frontend developer.
highlights:
  - text:
      ru: Руководил кросс-функциональной командой разработки (4 разработчика) и продуктом «Кабинет выплат» (Cashout).
      en: Led a cross-functional development team (4 engineers) and the Cashout product.
    tags: {}
  - text:
      ru: >-
        Развивал ядро продукта — самостоятельный вывод средств: автор выбирает источник
        заработка и выводит нужную сумму, а рядом живут аналитика заработка и сопутствующие функции.
      en: >-
        Drove the product core, self-service withdrawal: a creator picks an earnings source
        and cashes out what they need, with earnings analytics and related features alongside.
    tags: {}
  - text:
      ru: "Масштаб сервиса: десятки тысяч авторов и выплаты на десятки миллионов рублей в месяц."
      en: "Service scale: tens of thousands of creators and payouts of tens of millions of rubles per month."
    tags: {}
  - text:
      ru: Планировал и реализовывал продуктовые интеграции и улучшения.
      en: Planned and delivered product integrations and improvements.
    tags: {}
  - text:
      ru: >-
        Налаживал работу со смежными отделами (тестирование, дизайн, аналитика, маркетинг
        и PR, редактура, документооборот, юристы), чтобы сервис держал нагрузку, UX
        оставался качественным, метрики роста отслеживались, а выплаты самозанятым,
        ИП и юрлицам уходили корректно.
      en: >-
        Worked closely with adjacent departments (QA, design, analytics, marketing and PR,
        editorial, document flow, legal) so the service stayed resilient, the UX stayed
        solid, growth metrics were tracked, and payouts to the self-employed, sole
        proprietors and legal entities went out correctly.
    tags: { audience: [hr, technical] }
  - text:
      ru: Интегрировал смежные отделы для автоматизации рутинных процессов.
      en: Integrated adjacent departments to automate routine processes.
    tags: { audience: [hr, technical] }
  - text:
      ru: Проводил 1:1 и перформанс-ревью, планировал цели и точки роста команды.
      en: Ran 1:1s and performance reviews, set goals and growth areas for the team.
    tags: { audience: [hr] }
  - text:
      ru: Hands-on разрабатывал интерфейсы финтеха ВКонтакте и сервиса «Кабинет выплат» (Cashout).
      en: Hands-on development of VK fintech UIs and the Cashout service.
    tags: {}
