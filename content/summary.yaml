# Варианты блока "Кратко". compose берёт лучший по priority среди релевантных
# (по audience/system).
variants:
  - id: summary-general
    priority: 10
    tags:
      audience: [hr, technical]
    text:
      ru: >-
        Инженерный руководитель, 10+ лет в IT и 3+ года в управлении командами.
        В Positive Technologies построил frontend-направление с нуля и вырастил его
        до отдела в 11 человек и четырёх кросс-функциональных команд. До этого работал
        в Яндексе и VK. Совмещаю стратегию и процессы с hands-on разработкой на React,
        Angular и TypeScript. Вырос из fullstack-разработчика, поэтому при необходимости
        закрываю и backend: Python, PHP, Node.js. Внедрил AI-assisted development
        в командах, и разработка ускорилась в полтора раза.
      en: >-
        Engineering manager with 10+ years in tech and 3+ years leading teams.
        At Positive Technologies I built the frontend function from scratch and grew it
        into an 11-person department across four cross-functional teams. Before that,
        Yandex and VK. I pair strategy and process with hands-on work in React, Angular
        and TypeScript. I came up as a full-stack developer, so I still cover backend
        when it's needed: Python, PHP, Node.js. Bringing AI-assisted development into the
        teams sped up our delivery by half.

  - id: summary-ats
    priority: 20
    tags:
      audience: [ats]
    # Версия под автоотбор: плотная по ключевым словам.
    text:
      ru: >-
        Engineering Manager / Руководитель отдела frontend-разработки. 10+ лет в IT,
        3+ года в управлении. Управление командами, найм и развитие, процессы,
        стейкхолдер-менеджмент. Стек: TypeScript, React, Angular, Node.js, Python,
        PHP, CI/CD, Docker, дизайн-системы, FrontOps, AI-assisted development.
      en: >-
        Engineering Manager / Head of Frontend. 10+ years in tech, 3+ years in
        management. Team leadership, hiring and growth, process design, stakeholder
        management. Stack: TypeScript, React, Angular, Node.js, Python, PHP, CI/CD,
        Docker, design systems, FrontOps, AI-assisted development.
