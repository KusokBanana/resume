# hh.ru — HR-аудитория, богатый layout, оба языка.
id: hh
label:
  ru: hh.ru
  en: hh.ru
# Заголовок под рекрутёрский поиск hh: точное совпадение с реальными запросами
# («руководитель отдела разработки», «engineering manager»), а не «Head of Engineering»
# с лендинга — по нему на hh не ищут. Намеренно БЕЗ привязки к frontend/backend:
# это резюме менеджера разработки в целом (фронт-специфика — у hh-teamlead).
title:
  ru: Руководитель отдела разработки (Engineering Manager)
  en: Engineering Manager
languages: [ru, en]
system: hh
audience: hr
layout: rich
formats: [html, pdf, md, txt]
sections: [summary, achievements, experience, skills, languages, education]
# Канонический вариант: его PDF отдаёт лендинг (см. downloads.ts).
canonical: true
select:
  # Управленческая версия: микро-метрики уровня мидла/техлида (визуальные баги,
  # email-письма) девальвируют блок «Ключевые результаты» — они остаются
  # в теле опыта и в IC/тимлид-вариантах.
  excludeIds: [visual-bugs, email-cost]
