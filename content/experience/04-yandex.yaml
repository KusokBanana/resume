highlights:
  # Универсальные пункты (видны и в ATS-варианте)
  - text:
      ru: "Создал и развивал библиотеку UI-компонентов, перевёл на неё большинство проектов отдела — новые интерфейсы стали собираться в разы быстрее."
      en: "Built and grew a UI component library and moved most of the team's projects onto it, so new interfaces came together several times faster."
    tags: {}
  - text:
      ru: Менторил коллег по backend- и frontend-разработке.
      en: Mentored colleagues in backend and frontend development.
    tags: {}
  - text:
      ru: "Был product owner нескольких продуктов: отвечал за их развитие и поддержку."
      en: "Was product owner for several of the products: responsible for their growth and support."
    tags: {}
  # Детальный список конкретных сервисов (скрывается в ATS-варианте ради краткости)
  - text:
      ru: Писал документацию по внешней и внутренней эксплуатации сервисов.
      en: Wrote external and internal operations documentation for services.
    tags: { audience: [hr, technical] }
  - text:
      ru: Дорабатывал и поддерживал платформу заказа и выдачи серверов под нужды сервисов компании.
      en: Extended and maintained the server ordering and provisioning platform for company services.
    tags: { audience: [hr, technical] }
  - text:
      ru: "Сделал сервис комплектации, разукомплектации и перекомплектации оборудования — от серверных компонентов до частей беспилотных автомобилей."
      en: "Built a service for assembling, disassembling and re-assembling equipment — from server components to self-driving-car parts."
    tags: { audience: [hr, technical] }
  - text:
      ru: "Поднял платформу ремонта оборудования, закрывающую весь цикл: от заявки до возврата починенного железа из сервисного центра."
      en: "Stood up an equipment-repair platform that covered the whole cycle: from the request to getting the repaired hardware back from the service centre."
    tags: { audience: [hr, technical] }
  - text:
      ru: Собрал интерфейс исполнения заявок в дата-центрах — замену компонентов и серверов.
      en: Built the UI for fulfilling data-centre work orders — component and server replacement.
    tags: { audience: [hr, technical] }
  - text:
      ru: Написал систему технического учёта материальных активов компании.
      en: Wrote a technical asset-tracking system for the company's physical assets.
    tags: { audience: [hr, technical] }
  - text:
      ru: Автоматизировал инвентаризацию производства серверного оборудования на заводе — сделал для этого отдельный интерфейс.
      en: Automated inventory of server-hardware manufacturing on the factory floor with a dedicated UI.
    tags: { audience: [hr, technical] }
  - text:
      ru: Разработал сервис транзакционного изменения состояния оборудования в системах инвентарного и количественного учёта.
      en: Built a service for transactional equipment-state changes across inventory and quantity-accounting systems.
    tags: { audience: [hr, technical] }
  - text:
      ru: "Построил сервис заказа на закупку и производство серверов: по минимально необходимой конфигурации он подбирает самое выгодное по цене железо."
      en: "Built a procurement and manufacturing ordering service: given a minimal required configuration, it picks the most cost-effective hardware."
    tags: { audience: [hr, technical] }
metrics:
