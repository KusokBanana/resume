# Единый реестр навыков — источник истины для строки «Стек» карточек опыта/экспортов
# (стек компании = навыки с её id в `at` и stack:true) И для глобальной секции «Навыки».
#
# Политика:
#   stack:true  — попадает в строку «Стек» карточек опыта. ТОЛЬКО «ядро» (языки, основные
#                 фреймворки, БД) и «легаси». Библиотеки/инструменты/инфра в стек НЕ идут.
#   global:true — показывается чипом в витрине навыков (сгруппировано).
#   Ядро:   stack:true, global:true  (и в стеке, и чипом).
#   Легаси: stack:true, global:false (только в стеке старых работ).
#   Прочее (библиотеки, тесты, инфра, компетенции): stack:false, global:true (только чип).
#   group — группа витрины (обязательна при global:true).
#
# Порядок массива задаёт порядок в строке «Стек» (по stack:true) и внутри группы витрины.
# Порядок ГРУПП — по priority.
#
# ⚠ `at` — фактические/предположительные привязки к местам работы, ПРОВЕРЬ.

groups:
  - { id: management, priority: 100, name: { ru: Управление, en: Management } }
  - { id: frontend, priority: 90, name: { ru: Frontend, en: Frontend } }
  - { id: ai, priority: 80, name: { ru: AI в разработке, en: AI in development } }
  - { id: backend, priority: 75, name: { ru: Backend, en: Backend } }
  - { id: infra, priority: 70, name: { ru: Инфраструктура / DevOps / Другое, en: Infrastructure / DevOps / Other } }

