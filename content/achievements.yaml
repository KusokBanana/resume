# Ключевые результаты (вверху резюме). Жирный лид-акцент через **...**.
# Порядок — по priority (выше = выше).
#
# ⚠ Формулировки НАМЕРЕННО не совпадают с пунктами опыта дословно: этот блок —
# выжимка, а LLM-скоринг ATS штрафует дословные повторы как накрутку объёма.
# Перефразируя пункт опыта — не копируй его сюда, и наоборот.
# Ролевой отбор — через excludeIds в targets/hh-*.yaml: управленческие версии
# скрывают микро-метрики (visual-bugs, email-cost), IC-версии — менеджерские
# результаты (scale, retention, growth).
items:
  - id: scale
    priority: 100
    tags: {}
    text:
      ru: "**Отдел 0 → 11 за год.** Четыре кросс-функциональные команды — лид, фронтендеры и дизайнер в каждой; весь найм вёл сам, с рынка и внутренней ротацией."
      en: "**Department grown 0 → 11 in a year.** Four cross-functional teams — a lead, frontend engineers and a designer in each; I did all the hiring myself, external and internal."

  - id: retention
    priority: 95
    tags: {}
    text:
      ru: "**Ни один человек не ушёл из отдела добровольно за два года.** Удержал ядро команды, пока компанию штормило."
      en: "**Not a single person left the department voluntarily in two years.** Held the team's core together while the company weathered a storm."

  - id: growth
    priority: 90
    tags: {}
    text:
      ru: "**Шесть повышений внутри команды**: три человека выросли до senior-уровня, ещё три — до руководителей."
      en: "**Six promotions inside the team**: three people grew to senior level, three more became leads."

  - id: ai-speedup
    priority: 85
    tags: {}
    text:
      ru: "**Разработка ×1,5 быстрее с AI-инструментами** (Claude) — эффект подтверждён собственной аналитикой инженерных метрик; у отдельных инженеров — до ×2."
      en: "**Delivery 1.5× faster with AI tooling** (Claude) — the effect is backed by my own engineering-metrics analytics; up to 2× for individual engineers."

  - id: vk-release-flags
    priority: 82
    tags: {}
    text:
      ru: "**Ежедневные релизы в highload-финтехе ВКонтакте** — вместо редких больших выкаток: feature-flags и постепенный раскат по сегментам пользователей."
      en: "**Daily releases in VK's high-load fintech** instead of rare big-bang rollouts: feature flags and gradual rollout by user segment."

  - id: release-time
    priority: 80
    tags: {}
    text:
      ru: "**Релиз готовится 10 минут вместо двух часов** — весь цикл подготовки закрыт автоматизацией."
      en: "**Release prep takes 10 minutes instead of two hours** — the whole cycle is covered by automation."

  - id: visual-bugs
    priority: 75
    tags: {}
    text:
      ru: "**0–1 визуальный баг на релиз вместо стабильных 5–10** — эффект выстроенного дизайн-ревью."
      en: "**0–1 visual bug per release instead of a steady 5–10** — the payoff of the design-review practice I set up."

  - id: email-cost
    priority: 70
    tags: {}
    text:
      ru: "**Email-письма делаются за пару часов, а не за неделю**: вместо связки «дизайнер плюс разработчик» справляется один человек + ИИ."
      en: "**Emails now take a couple of hours, not a week**: one person with AI handles what used to need a designer-developer pair."
